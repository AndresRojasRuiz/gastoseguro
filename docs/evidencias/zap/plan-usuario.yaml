# Plan de OWASP ZAP (Automation Framework) - GastoSeguro, perfil: usuario estándar
env:
  contexts:
  - name: "GastoSeguro"
    urls:
    - "http://localhost:4100"
    includePaths:
    - "http://localhost:4100.*"
    excludePaths:
    - "http://localhost:4100/api/auth/logout.*"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
- type: replacer
  parameters:
    deleteAllRules: true
  rules:
  - description: "Token de acceso (usuario estándar)"
    url: ""
    matchType: "req_header"
    matchString: "Authorization"
    matchRegex: false
    replacementString: "Bearer ${GS_TOKEN}"
    tokenProcessing: false
- type: openapi
  parameters:
    apiFile: "openapi-zap.json"  # docs/openapi.json con identificadores reales
    targetUrl: "http://localhost:4100"
    context: "GastoSeguro"
- type: spider
  parameters:
    context: "GastoSeguro"
    url: "http://localhost:4100/"
    maxDuration: 2
- type: passiveScan-wait
  parameters:
    maxDuration: 10
- type: activeScan
  parameters:
    context: "GastoSeguro"
    maxRuleDurationInMins: 3
    maxScanDurationInMins: 30
    threadPerHost: 4
- type: passiveScan-wait
  parameters:
    maxDuration: 10
- type: report
  parameters:
    template: "traditional-html"
    reportDir: "out"
    reportFile: "zap-usuario"
    reportTitle: "GastoSeguro - DAST OWASP ZAP 2.17.0 (usuario estándar)"
- type: report
  parameters:
    template: "traditional-json"
    reportDir: "out"
    reportFile: "zap-usuario"
    reportTitle: "GastoSeguro - DAST OWASP ZAP 2.17.0 (usuario estándar)"
